# dArkOS: the Vulkan driver each program gets (read by libvulkan_darkos.so when a program
# first uses Vulkan; vk-driver-select/ in the dArkOS repository).
#
#   mali     Arm's driver (libmali), the system's
#   malisx2  malisx2 (github.com/bmdhacks/malisx2), Mesa's compilers over Arm's kernel driver;
#            written for the ARMSX2 PS2 emulator, it lacks parts other programs may need
#   /path    a driver library of your own
#
# "<program> = <driver>" names a program by its executable (armsx2-sdl, retroarch,
# dolphin-emu-nogui, PPSSPPSDL, ...); "default" is every other one. DARKOS_VULKAN=<driver>
# in a program's environment overrides this file.

default = mali

# The ES systems whose EMULATOR SETTINGS offer a VULKAN DRIVER choice (AUTO, MALI, MALISX2), separated
# by commas: the systems whose emulators draw with Vulkan. ES passes the choice as DARKOS_VULKAN;
# AUTO leaves it to this file. An alias system (es-aliases.py: n3ds for GammaOS's 3DS folder) is
# named on its own.
es_systems = 3ds, n3ds, ps2, ppsspp, pspminis, psx, dreamcast, naomi, Sega Atomiswave, ports
